name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15   # fail fast if a timeout/subprocess test ever wedges
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras for full coverage, incl. polars)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
        timeout-minutes: 5

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel in a clean env and smoke-test
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/python -c "import safedata as sd; assert sd.__all__ == ['ask','scan','protect','Guard','Policy','Result','ScanReport','Receipt','SafedataError'], sd.__all__; print('public API ok', sd.__version__)"
          /tmp/v/bin/safedata --version
      - name: Ensure no caches/build files in the sdist
        run: |
          tar tzf dist/*.tar.gz | grep -E "__pycache__|\.pyc$|\.pytest_cache|\.env$" && exit 1 || echo "sdist clean"
