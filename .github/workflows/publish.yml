name: Publish to PyPI

# Trusted Publishing (OIDC): no API token/password stored as a secret. Configure
# the publisher once at https://pypi.org/manage/project/safedata-guard/settings/publishing/
# (owner = this repo, workflow = publish.yml, environment = pypi).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Don't fail the run if this version is already on PyPI (e.g. it was
          # uploaded manually). New versions still publish normally.
          skip-existing: true
